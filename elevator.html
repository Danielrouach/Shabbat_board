<!doctype html>
<html lang="he" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>מעלית שבת | לוח שבת - משפחת רואש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Frank+Ruhl+Libre:wght@600;700&display=swap" rel="stylesheet">
<script src="cloud-config.js"></script>
<script src="shabbat-elevator.js"></script>
<style>
:root{--bg:#080c10;--panel:#0d1520;--line:#223344;--gold:#c8a44a;--green:#4adb8a;--muted:#9baabb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#eef2f8;overflow:hidden;font-family:Heebo,Arial,sans-serif}
#frame{height:100dvh;display:flex;flex-direction:column;padding:clamp(12px,2vh,28px) clamp(16px,3vw,54px);gap:clamp(9px,1.3vh,18px)}
header{display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid #39424b;padding-bottom:clamp(8px,1.4vh,16px)}
h1{color:var(--gold);font-family:'Frank Ruhl Libre',serif;font-size:clamp(2rem,4vw,4.2rem);margin:0}
.subtitle{font-size:clamp(.9rem,1.5vw,1.5rem);color:var(--muted)}#clock{text-align:left;font-size:clamp(1.8rem,3.5vw,3.8rem);font-weight:900;font-variant-numeric:tabular-nums;direction:ltr}
#date{color:var(--muted);text-align:left;font-size:clamp(.85rem,1.4vw,1.25rem)}
#status{font-size:clamp(.77rem,1.12vw,1rem);color:var(--muted);min-height:1.5em}
#tiles{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:clamp(5px,1.1vh,14px)}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:clamp(5px,1vh,15px);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;gap:2px}
.time{font-size:clamp(1rem,2.6vw,2.9rem);font-weight:900;white-space:nowrap;direction:ltr;font-variant-numeric:tabular-nums}
.caption{font-size:clamp(.7rem,1.1vw,1.1rem);color:var(--muted)}
.tile.past{opacity:.38}.tile.current{border:2px solid var(--green);background:#143026;box-shadow:0 0 21px rgba(74,219,138,.15)}.tile.current .time,.tile.current .caption{color:var(--green)}
.tile.next{border-color:var(--gold)}
#empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:clamp(1.2rem,2.1vw,2rem)}
footer{border-top:1px solid var(--line);padding-top:7px;color:#758899;font-size:clamp(.7rem,1vw,1rem);text-align:center}
[hidden]{display:none !important}
@media(max-height:680px){#frame{padding:7px 18px;gap:5px}.tile{padding:2px 4px}.time{font-size:clamp(.9rem,2.1vw,1.7rem)}.caption{font-size:.73rem}header{padding-bottom:4px}h1{font-size:2rem}}
@media(max-width:650px){#tiles{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr))}.time{font-size:clamp(.92rem,3vw,1.6rem)}}

#qa-controls{display:none;position:fixed;top:9px;left:9px;z-index:999;border:1px solid var(--gold);background:#182536;padding:10px;border-radius:7px;box-shadow:0 0 18px #000;gap:7px;align-items:center;flex-wrap:wrap;max-width:90vw}
#qa-controls.visible{display:flex}#qa-controls input,#qa-controls button{font:14px Heebo,Arial;padding:5px 9px;background:#111f2e;color:#fff;border:1px solid #735d2c;border-radius:5px;cursor:pointer}
#qa-controls label{font-size:.8rem}#simFlag{font-weight:bold;color:#4adb8a}#status.warning{color:#f3b66a}

/* Refined Hebrew-first header with graceful layout on TVs */
header{align-items:center;padding-bottom:clamp(10px,1.5vh,17px);gap:clamp(12px,2vw,30px)}
.masthead{min-width:0;flex:1}.eyebrow{font-size:clamp(.7rem,.95vw,1rem);letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
h1{line-height:1.12;letter-spacing:.01em}
.date-range{color:#e8d5a0;font-size:clamp(.85rem,1.5vw,1.45rem);font-weight:500;margin-top:clamp(2px,.45vh,8px)}
.subtitle{font-size:clamp(.8rem,1.1vw,1.05rem)}
.date-block{display:flex;flex-direction:column;align-items:flex-end;gap:0;flex:0 0 auto;text-align:left;max-width:45%}
#hebrewDate{font-family:'Frank Ruhl Libre',serif;color:var(--gold);font-size:clamp(1.1rem,2vw,2rem);font-weight:700;line-height:1.2}
#date{font-size:clamp(.75rem,1.15vw,1.15rem);color:#b6c2ce;direction:rtl}
#status{font-size:clamp(.7rem,.95vw,.9rem);min-height:0}
@media(max-width:650px){header{gap:9px}h1{font-size:clamp(1.4rem,4.5vw,2rem)}#clock{font-size:clamp(1.25rem,4vw,2rem)}.date-range{font-size:clamp(.78rem,2.5vw,.95rem)}}
@media(max-height:680px){.eyebrow{font-size:.7rem}.date-range{margin-top:0}#hebrewDate{font-size:1.2rem}}
</style></head>
<body><div id="frame">
<header><div class="masthead"><div class="eyebrow">לוח שבת - משפחת רואש</div><h1>🛗 זמני מעלית שבת</h1><div class="subtitle" id="dayLabel">לוח שבת</div><div class="date-range" id="weekRange">טוען תאריכי שבת…</div></div><div class="date-block"><div id="clock">--:--</div><div id="hebrewDate">—</div><div id="date">—</div></div></header>
<div id="status"></div><div id="qa-controls" aria-label="סימולציית זמן">
  <label>תאריך <input type="date" id="qa-date"></label>
  <label>שעה <input type="time" id="qa-time" value="12:00"></label>
  <button id="qa-go" type="button">▶ הפעל</button>
  <button id="qa-reset" type="button">↺ איפוס</button>
  <span id="simFlag"></span>
</div>
<div id="tiles" hidden></div><div id="empty">טוען את זמני מעלית שבת…</div>
<footer>לוח תצוגה אוטומטי · ללא צורך בגלילה או בלחיצות · הנתונים נשמרים בדפדפן</footer>
</div>
<script>
'use strict';
const STORE='halachic_kiosk_weekly_v1';
const zone='Asia/Jerusalem';
let mockNow=null;
function nowParts(){
 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(mockNow===null?new Date():new Date(mockNow));
 const p={};for(const x of parts)p[x.type]=x.value;
 return {year:+p.year,month:+p.month,day:+p.day,weekday:p.weekday,hour:+p.hour,minute:+p.minute,second:+p.second};
}
const mapDay={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
function iso(y,m,d){return [y,String(m).padStart(2,'0'),String(d).padStart(2,'0')].join('-')}
function weekKey(p){
 const utc=new Date(Date.UTC(p.year,p.month-1,p.day,12));
 utc.setUTCDate(utc.getUTCDate()-(mapDay[p.weekday]??utc.getUTCDay()));
 return iso(utc.getUTCFullYear(),utc.getUTCMonth()+1,utc.getUTCDate());
}

function dateFromISO(ymd,days=0){
 const [y,m,d]=ymd.split('-').map(Number);
 return new Date(Date.UTC(y,m-1,d+days,12));
}
const hebrewFmt=new Intl.DateTimeFormat('he-IL-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
const civilFmt=new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
function hebrewDate(d){
 try{return hebrewFmt.format(d)}catch{return '—'}
}
function civilDate(d){
 return civilFmt.format(d);
}
function shabbatRange(p){
 const fri=dateFromISO(weekKey(p),5),sat=dateFromISO(weekKey(p),6);
 const fDay=fri.getUTCDate(),sDay=sat.getUTCDate();
 const fMonth=new Intl.DateTimeFormat('he-IL',{month:'long',timeZone:'UTC'}).format(fri);
 const sMonth=new Intl.DateTimeFormat('he-IL',{month:'long',timeZone:'UTC'}).format(sat);
 const year=sat.getUTCFullYear();
 const range=fMonth===sMonth&&fri.getUTCFullYear()===year
   ? fDay+'–'+sDay+' ב'+sMonth+', '+year
   : fDay+' ב'+fMonth+' – '+sDay+' ב'+sMonth+', '+year;
 return 'זמני מעלית שבת לשבת שבין '+range;
}
function readStore(){try{const o=JSON.parse(localStorage.getItem(STORE)||'{}');return o&&typeof o==='object'&&!Array.isArray(o)?o:{}}catch{return {}}}
function isClock(v){return typeof v==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(v)}
function toMin(v){return +v.slice(0,2)*60 + +v.slice(3)}
function render(){
 const instant=mockNow===null?new Date():new Date(mockNow);
 const p=nowParts(),today=mapDay[p.weekday];
 document.getElementById('clock').textContent=[p.hour,p.minute,p.second].map(n=>String(n).padStart(2,'0')).join(':');
 const todayDate=dateFromISO(iso(p.year,p.month,p.day));
 document.getElementById('date').textContent=civilDate(todayDate);
 document.getElementById('hebrewDate').textContent=hebrewDate(todayDate);
 document.getElementById('weekRange').textContent=shabbatRange(p);
 const suffix=mockNow===null?'':' · סימולציה';
 document.getElementById('dayLabel').textContent=(today===5?'ערב שבת · יום שישי':today===6?'שבת קודש':'מעלית שבת · לוח שבועי')+suffix;
 const data=readStore()[weekKey(p)];
 const computed=ShabbatElevator.display(instant,data);
 const grid=document.getElementById('tiles'),empty=document.getElementById('empty'),status=document.getElementById('status');
 const arr=computed.rows,minutes=computed.minutes,next=arr.findIndex(r=>r.b>minutes);
 grid.replaceChildren();
 if(!arr.length){
   grid.hidden=true;empty.hidden=false;
   empty.textContent=computed.finished?'מעלית השבת סיימה את פעילותה (30 דקות לאחר צאת שבת)':(today===5||today===6)?'אין זמני מעלית שמורים לשבוע הנוכחי':'זמני המעלית יוצגו כאן אוטומטית ביום שישי ובשבת';
   status.textContent=data?'נתוני השבוע נטענו':'ממתין לזמני השבוע מ־Google Drive';return;
 }
 arr.forEach((r,i)=>{
  const active=minutes>=r.a&&minutes<r.b;
  const tile=document.createElement('div');
  tile.className='tile'+(active?' current':r.b<=minutes?' past':i===next?' next':'');
  const time=document.createElement('div');time.className='time';
  time.textContent=r.start+'–'+(r.cutoffTime||r.end);
  const caption=document.createElement('div');caption.className='caption';
  caption.textContent=active?'פעיל עכשיו':r.b<=minutes?'הסתיים':i===next?'החלון הבא':r.repeated?'מחזור מוצאי שבת':'פעילות';
  tile.append(time,caption);grid.append(tile);
 });
 grid.hidden=false;empty.hidden=true;
 status.classList.toggle('warning',computed.unknown);
 status.textContent='מוצגים '+arr.length+' חלונות פעילות'+(computed.unknown?' · ⚠ זמן עצירה לא אומת — יש לטעון את הלוח לפני שבת':'');
}

function refresh(){
 const url=window.SHABBAT_CLOUD_READ_URL;
 if(!url||!/^https:\/\/script\.google\.com\/macros\/s\//.test(url))return;
 const cb='shabbatCloudCallback_'+Math.random().toString(36).slice(2,14);
 const el=document.createElement('script');let done=false;
 const clean=()=>{if(done)return;done=true;delete window[cb];el.remove()};
 window[cb]=payload=>{
  clean();
  if(!payload||!payload.ok||payload.data?.format!=='halachic-weekly-v1'||!payload.data.weeks||typeof payload.data.weeks!=='object')return;
  const store=readStore();
  for(const [key,val] of Object.entries(payload.data.weeks)){
   if(/^20\d{2}-\d{2}-\d{2}$/.test(key)&&val&&typeof val==='object')store[key]=val;
  }
  try{localStorage.setItem(STORE,JSON.stringify(store))}catch(e){}
  render();
 };
 el.onerror=clean;
 el.src=url+(url.includes('?')?'&':'?')+'callback='+encodeURIComponent(cb)+'&t='+Date.now();
 document.head.append(el);setTimeout(clean,20000);
}

// Simulation uses Asia/Jerusalem wall time even if the OS timezone differs.
function simulatedInstant(date,time){
 const parts=date.split('-').map(Number),hm=time.split(':').map(Number);
 const target=Date.UTC(parts[0],parts[1]-1,parts[2],hm[0],hm[1]);
 let ms=target;
 for(let i=0;i<3;i++){
  const p=ShabbatElevator.localParts(new Date(ms));
  const got=Date.UTC(p.y,p.m-1,p.d,Math.floor(p.minutes/60),p.minutes%60);
  ms+=target-got;
 }
 return ms;
}
function qaToggle(){document.getElementById('qa-controls').classList.toggle('visible')}
function qaGo(){
 const date=document.getElementById('qa-date').value,time=document.getElementById('qa-time').value;
 if(!date||!time)return;
 mockNow=simulatedInstant(date,time);
 document.getElementById('simFlag').textContent='סימולציה פועלת';
 ShabbatElevator.prime(new Date(mockNow)).then(render);render();
}
function qaReset(){mockNow=null;document.getElementById('simFlag').textContent='';ShabbatElevator.prime(new Date()).then(render);render()}
document.addEventListener('keydown',e=>{
 if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='q'){e.preventDefault();qaToggle()}
 if(e.key==='Escape')document.getElementById('qa-controls').classList.remove('visible');
});
document.getElementById('qa-go').onclick=qaGo;
document.getElementById('qa-reset').onclick=qaReset;
const curr=nowParts();
document.getElementById('qa-date').value=iso(curr.year,curr.month,curr.day);
document.getElementById('qa-time').value=String(curr.hour).padStart(2,'0')+':'+String(curr.minute).padStart(2,'0');
if(new URLSearchParams(location.search).has('qa'))qaToggle();
ShabbatElevator.onChange(render);
render();setInterval(render,1000);refresh();setInterval(refresh,5*60*1000);
ShabbatElevator.prime(new Date()).then(render);
setInterval(()=>ShabbatElevator.prime(mockNow===null?new Date():new Date(mockNow)),60*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();ShabbatElevator.prime(mockNow===null?new Date():new Date(mockNow))}});
</script></body></html>
