<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול לוח תפילות</title><style>body{font:17px Arial;background:#0d1520;color:#eee;max-width:760px;margin:35px auto;padding:20px}textarea{width:100%;height:240px;background:#182536;color:white;padding:12px;box-sizing:border-box}button{padding:12px 25px;background:#c8a44a;color:#111;font-weight:bold;border:0;border-radius:6px}#status{padding:15px}</style></head><body><h1>ניהול פרטי — לוח שארית ישראל</h1><p>ערוך את הזמנים בקובץ editor.html המקומי, לחץ ״גיבוי שבועות״, והעלה כאן את קובץ ה-JSON. רק בעל החשבון המורשה יכול להשתמש במסך הזה.</p><input type="file" accept=".json,application/json" id="file"><p>או הדבק JSON:</p><textarea id="json"></textarea><p><button id="save">שמור ב-Google Drive</button></p><div id="status" role="status"></div><script>document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(f)document.getElementById('json').value=await f.text()};document.getElementById('save').onclick=()=>{const s=document.getElementById('status');s.textContent='שומר…';google.script.run.withSuccessHandler(x=>s.textContent='✅ '+x).withFailureHandler(e=>s.textContent='❌ '+e.message).writeSchedules(document.getElementById('json').value)};</script></body></html>
