<script>
'use strict';
const STORE='halachic_kiosk_weekly_v1';
const zone='Asia/Jerusalem';
let mockNow=null;
let cloudState='pending';
let cloudError='';
function nowParts(){
 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(mockNow===null?new Date():new Date(mockNow));
 const p={};for(const x of parts)p[x.type]=x.value;
 return {year:+p.year,month:+p.month,day:+p.day,weekday:p.weekday,hour:+p.hour,minute:+p.minute,second:+p.second};
}
const mapDay={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
function iso(y,m,d){return [y,String(m).padStart(2,'0'),String(d).padStart(2,'0')].join('-')}
function weekKey(p){
 const utc=new Date(Date.UTC(p.year,p.month-1,p.day,12));
 utc.setUTCDate(utc.getUTCDate()-(mapDay[p.weekday]??utc.getUTCDay()));
 return iso(utc.getUTCFullYear(),utc.getUTCMonth()+1,utc.getUTCDate());
}

function dateFromISO(ymd,days=0){
 const [y,m,d]=ymd.split('-').map(Number);
 return new Date(Date.UTC(y,m-1,d+days,12));
}
const hebrewFmt=new Intl.DateTimeFormat('he-IL-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
const civilFmt=new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
function hebrewNumeral(value){
 let n=Number(value);
 if(!Number.isInteger(n)||n<1)return String(value);
 const letters=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
 if(n===15)return 'ט״ו';
 if(n===16)return 'ט״ז';
 let out='';
 for(const [amount,letter] of letters)while(n>=amount){out+=letter;n-=amount;}
 return out.length===1?out+'׳':out.slice(0,-1)+'״'+out.slice(-1);
}
function hebrewYear(year){
 const n=Number(year);
 if(!Number.isInteger(n)||n<1)return String(year);
 const thousands=Math.floor(n/1000),remainder=n%1000;
 return hebrewNumeral(thousands)+hebrewNumeral(remainder);
}
function hebrewDate(d){
 try{
  const parts=hebrewFmt.formatToParts(d);
  const get=k=>parts.find(p=>p.type===k)?.value||'';
  return hebrewNumeral(get('day'))+' ב'+get('month')+' '+hebrewYear(get('year'));
 }catch{return '—'}
}
function civilDate(d){
 return civilFmt.format(d);
}
function shabbatRange(p){
 const fri=dateFromISO(weekKey(p),5),sat=dateFromISO(weekKey(p),6);
 const fDay=fri.getUTCDate(),sDay=sat.getUTCDate();
 const fMonth=new Intl.DateTimeFormat('he-IL',{month:'long',timeZone:'UTC'}).format(fri);
 const sMonth=new Intl.DateTimeFormat('he-IL',{month:'long',timeZone:'UTC'}).format(sat);
 const year=sat.getUTCFullYear();
 const range=fMonth===sMonth&&fri.getUTCFullYear()===year
   ? fDay+'–'+sDay+' ב'+sMonth+', '+year
   : fDay+' ב'+fMonth+' – '+sDay+' ב'+sMonth+', '+year;
 return 'זמני מעלית שבת לשבת שבין '+range;
}
function readStore(){try{const o=JSON.parse(localStorage.getItem(STORE)||'{}');return o&&typeof o==='object'&&!Array.isArray(o)?o:{}}catch{return {}}}
function isClock(v){return typeof v==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(v)}
function toMin(v){return +v.slice(0,2)*60 + +v.slice(3)}
function render(){
 const instant=mockNow===null?new Date():new Date(mockNow);
 if(window.ShabbatTheme)ShabbatTheme.sync(instant);
 const p=nowParts(),today=mapDay[p.weekday];
 document.getElementById('clock').textContent=[p.hour,p.minute,p.second].map(n=>String(n).padStart(2,'0')).join(':');
 const todayDate=dateFromISO(iso(p.year,p.month,p.day));
 document.getElementById('date').textContent=civilDate(todayDate);
 document.getElementById('hebrewDate').textContent=hebrewDate(todayDate);
 document.getElementById('weekRange').textContent=shabbatRange(p);
 const parasha=ShabbatElevator.parasha(instant).replace(/^(?:פרשת\s*)+/,'').trim();
 document.getElementById('parashaTitle').textContent=parasha?'זמני מעלית שבת לפרשת '+parasha:'זמני מעלית שבת';
 const suffix=mockNow===null?'':' · סימולציה';
 document.getElementById('dayLabel').textContent=(today===5?'ערב שבת · יום שישי':today===6?'שבת קודש':'תצוגה מקדימה · שבת הקרובה')+suffix;
 const saved=readStore();
 const selectedWeek=weekKey(p);
 // Use the most recent saved elevator timetable if the current week has none.
 const elevatorSelection=ShabbatUpdateStatus.elevatorSchedule(saved,selectedWeek);
 const data=elevatorSelection.entry;
 const usingPrevious=elevatorSelection.old;
 const storedWeeks=Object.keys(saved).filter(k=>/^20\d{2}-\d{2}-\d{2}$/.test(k)).sort();
 const computed=ShabbatElevator.display(instant,data);
 const grid=document.getElementById('tiles'),empty=document.getElementById('empty'),status=document.getElementById('status');
 const preview=today!==5&&today!==6;
 let arr=computed.rows,minutes=computed.minutes,next=arr.findIndex(r=>r.b>minutes);
 // On Sunday–Thursday show stored Friday/Saturday schedules for the upcoming Shabbat.
 // Keep preview clearly distinct from live running status.
 if(preview && data){
  const valid=r=>r && isClock(r.start)&&isClock(r.end)&&toMin(r.end)>toMin(r.start);
  const friday=Array.isArray(data.elevatorFriday)?data.elevatorFriday.filter(valid).map(r=>({...r,previewDay:'ערב שבת',a:toMin(r.start),b:toMin(r.end)})):[];
  const saturday=Array.isArray(data.elevatorSaturday)?data.elevatorSaturday.filter(valid).map(r=>({...r,previewDay:'יום שבת',a:toMin(r.start),b:toMin(r.end)})):[];
  arr=friday.concat(saturday);minutes=-1;next=-1;
 }
 grid.replaceChildren();
 if(!arr.length){
  grid.hidden=true;empty.hidden=false;
  if(computed.finished)empty.textContent='מעלית השבת סיימה את פעילותה (30 דקות לאחר צאת שבת)';
  else if(!data)empty.textContent=cloudState==='error'?'לא ניתן להתחבר למקור הנתונים, ואין זמני מעלית שמורים במכשיר.':cloudState==='ready'?'טרם נקלטו זמני מעלית שמורים.':'טוען את זמני מעלית שבת…';
  else empty.textContent='לא הוגדרו זמני מעלית לשבת זו.';
 }else{
  arr.forEach((r,i)=>{
   const active=!preview&&minutes>=r.a&&minutes<r.b;
   const tile=document.createElement('div');
   tile.className='tile'+(preview?' preview':active?' current':r.b<=minutes?' past':i===next?' next':'');
   const time=document.createElement('div');time.className='time';time.textContent=r.start+'–'+(r.cutoffTime||r.end);
   const caption=document.createElement('div');caption.className='caption';
   caption.textContent=preview?r.previewDay:active?'פעיל עכשיו':r.b<=minutes?'הסתיים':i===next?'החלון הבא':r.repeated?'מחזור מוצאי שבת':'פעילות';
   tile.append(time,caption);grid.append(tile);
  });
  grid.hidden=false;empty.hidden=true;
 }
 status.classList.toggle('warning',computed.unknown);
 status.classList.toggle('error',cloudState==='error'&&!data);
 const description=preview?'תצוגה מקדימה של שישי ושבת הקרובים':'';
 const update=window.ShabbatUpdateStatus?ShabbatUpdateStatus.status(saved,'elevator',instant):null;
 status.classList.toggle('update-stale',!!update?.warning&&cloudState==='ready');
 const conn=cloudState==='error'?' · לא ניתן לרענן מהענן — נתונים שמורים מוצגים אם קיימים'
  :cloudState==='pending'?' · בודק נתונים בענן':cloudState==='ready'?' · '+(update?update.text:'נתוני הענן נבדקו'):'';
 status.textContent=(arr.length?'מוצגים '+arr.length+' חלונות פעילות':'')+(description?' · '+description:'')+(!data?' · שבוע מבוקש: '+selectedWeek+(storedWeeks.length?' · שבועות שמורים: '+storedWeeks.slice(-3).join(', '):' · עדיין אין שבועות שמורים'):'')+conn+
   (computed.unknown?' · ⚠ זמן עצירה לא אומת — יש לטעון את הלוח לפני שבת':'')+
   (cloudError&&cloudState==='error'?' · '+cloudError:'');
}

function refresh(){
 const url=window.SHABBAT_CLOUD_READ_URL;
 if(!url||!/^https:\/\/script\.google\.com\/macros\/s\//.test(url)){cloudState='error';cloudError='כתובת שירות הקריאה אינה מוגדרת';render();return;}
 const cb='shabbatCloudCallback_'+Math.random().toString(36).slice(2,14);
 const el=document.createElement('script');let done=false;let timeoutId=null;
 const clean=()=>{if(done)return;done=true;delete window[cb];el.remove();if(timeoutId)clearTimeout(timeoutId)};
 window[cb]=payload=>{
  clean();
  if(!payload||!payload.ok||payload.data?.format!=='halachic-weekly-v1'||!payload.data.weeks||typeof payload.data.weeks!=='object'){cloudState='error';cloudError='שירות הקריאה לא החזיר נתונים תקינים';render();return;}
  const store=readStore();
  for(const [key,val] of Object.entries(payload.data.weeks)){
   if(/^20\d{2}-\d{2}-\d{2}$/.test(key)&&val&&typeof val==='object')store[key]=val;
  }
  try{localStorage.setItem(STORE,JSON.stringify(store))}catch(e){}
  cloudState='ready';cloudError='';
  render();
 };
 el.onerror=()=>{clean();cloudState='error';cloudError='בקשת הנתונים נכשלה';render()};
 el.src=url+(url.includes('?')?'&':'?')+'callback='+encodeURIComponent(cb)+'&t='+Date.now();
 document.head.append(el);timeoutId=setTimeout(()=>{if(!done){clean();cloudState='error';cloudError='תם זמן ההמתנה לתשובת השרת';render()}},20000);
}

// Simulation uses Asia/Jerusalem wall time even if the OS timezone differs.
function simulatedInstant(date,time){
 const parts=date.split('-').map(Number),hm=time.split(':').map(Number);
 const target=Date.UTC(parts[0],parts[1]-1,parts[2],hm[0],hm[1]);
 let ms=target;
 for(let i=0;i<3;i++){
  const p=ShabbatElevator.localParts(new Date(ms));
  const got=Date.UTC(p.y,p.m-1,p.d,Math.floor(p.minutes/60),p.minutes%60);
  ms+=target-got;
 }
 return ms;
}
function qaToggle(){document.getElementById('qa-controls').classList.toggle('visible')}
function qaGo(){
 const date=document.getElementById('qa-date').value,time=document.getElementById('qa-time').value;
 if(!date||!time)return;
 mockNow=simulatedInstant(date,time);
 document.getElementById('simFlag').textContent='סימולציה פועלת';
 ShabbatElevator.prime(new Date(mockNow)).then(render);render();
}
function qaReset(){mockNow=null;document.getElementById('simFlag').textContent='';ShabbatElevator.prime(new Date()).then(render);render()}
document.addEventListener('keydown',e=>{
 if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='q'){e.preventDefault();qaToggle()}
 if(e.key==='Escape')document.getElementById('qa-controls').classList.remove('visible');
});
document.getElementById('qa-go').onclick=qaGo;
document.getElementById('qa-reset').onclick=qaReset;
const curr=nowParts();
document.getElementById('qa-date').value=iso(curr.year,curr.month,curr.day);
document.getElementById('qa-time').value=String(curr.hour).padStart(2,'0')+':'+String(curr.minute).padStart(2,'0');
if(new URLSearchParams(location.search).has('qa'))qaToggle();
ShabbatElevator.onChange(render);
render();setInterval(render,1000);refresh();setInterval(refresh,5*60*1000);
ShabbatElevator.prime(new Date()).then(render);
setInterval(()=>ShabbatElevator.prime(mockNow===null?new Date():new Date(mockNow)),60*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();ShabbatElevator.prime(mockNow===null?new Date():new Date(mockNow))}});

/* Screen Wake Lock is enabled by default; devices may require a user tap. */
let keepAwakeWanted=true;
let keepAwakeSentinel=null;
let wakeLockRequestRunning=false;
function updateKeepAwakeButton(message){
 const btn=document.getElementById('keep-awake-btn');
 if(!btn)return;
 const active=!!keepAwakeSentinel&&!keepAwakeSentinel.released;
 btn.classList.toggle('active',active);
 btn.textContent=message||(active?'● מסך פעיל: פועל':keepAwakeWanted?'⚠ מסך פעיל: ממתין':'◌ מסך פעיל: כבוי');
 btn.setAttribute('aria-pressed',String(active));
}
async function requestKeepAwake(){
 if(!keepAwakeWanted||wakeLockRequestRunning||document.visibilityState!=='visible')return;
 if(keepAwakeSentinel&&!keepAwakeSentinel.released)return;
 if(!('wakeLock' in navigator)){updateKeepAwakeButton('⚠ הדפדפן לא תומך');return;}
 wakeLockRequestRunning=true;
 try{
  const sentinel=await navigator.wakeLock.request('screen');
  if(!keepAwakeWanted){await sentinel.release();return;}
  keepAwakeSentinel=sentinel;
  sentinel.addEventListener('release',()=>{
   if(keepAwakeSentinel===sentinel)keepAwakeSentinel=null;
   updateKeepAwakeButton();
  });
  updateKeepAwakeButton();
 }catch(e){updateKeepAwakeButton('⚠ לחץ להפעלה');}
 finally{wakeLockRequestRunning=false;}
}
async function toggleKeepAwake(){
 // When the startup request fails, a click retries rather than turning it off.
 keepAwakeWanted=!(keepAwakeSentinel&&!keepAwakeSentinel.released);
 if(keepAwakeWanted)await requestKeepAwake();
 else{
  const sentinel=keepAwakeSentinel;keepAwakeSentinel=null;
  if(sentinel)try{await sentinel.release()}catch(e){}
  updateKeepAwakeButton();
 }
}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible'&&keepAwakeWanted)requestKeepAwake();
});
requestKeepAwake();

/* User-initiated fullscreen: not all mobile browsers expose the Fullscreen API. */
function fullscreenActive(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function updateFullscreenButton(){
 const btn=document.getElementById('fullscreen-btn');
 if(!btn)return;
 btn.textContent=fullscreenActive()?'⤢ צא ממסך מלא':'⛶ מסך מלא';
 btn.setAttribute('aria-pressed',String(fullscreenActive()));
}
async function toggleFullscreen(){
 const el=document.documentElement;
 try{
  if(fullscreenActive()){
   const exit=document.exitFullscreen||document.webkitExitFullscreen;
   if(exit)await exit.call(document);
  }else{
   const enter=el.requestFullscreen||el.webkitRequestFullscreen;
   if(!enter)throw new Error('not-supported');
   await enter.call(el);
  }
 }catch(e){
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
  alert(ios?'הדפדפן אינו מאפשר להפעיל מסך מלא מהכפתור. ב-Safari: פתח את תפריט השיתוף, בחר ״הוסף למסך הבית״ ופתח את הלוח מהסמל שנוצר.':'הדפדפן או המכשיר אינם מאפשרים מסך מלא כרגע. נסה להשתמש באפשרות מסך מלא של הדפדפן (F11 במחשב).');
 }
 updateFullscreenButton();
}
document.addEventListener('fullscreenchange',updateFullscreenButton);
document.addEventListener('webkitfullscreenchange',updateFullscreenButton);
updateFullscreenButton();
